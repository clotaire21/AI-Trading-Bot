name: Paper lab — safety, research and execution
on:
  workflow_dispatch:
    inputs:
      command:
        description: 'preflight reads only; validate includes research; paper remains policy-gated'
        type: choice
        options: [preflight, research, audit, validate, shadow, paper, canary-preflight, canary-validate, canary-paper]
        default: preflight
  schedule:
    # Seven UTC slots cover the six complete 10:00..15:00 New York bars in
    # both EDT and EST. The extra edge slot exits safely (pre-bar or closed).
    - cron: '7 15-21 * * 1-5'
permissions:
  contents: write
concurrency:
  group: paper-lab-state
  cancel-in-progress: false
jobs:
  lab:
    # Required even for manual runs on private repositories. This is an
    # attestation of an EXTERNAL hard billing stop, not a billing control itself.
    if: >-
      github.ref == 'refs/heads/main' &&
      vars.FREE_ACTIONS_CONFIRMED == 'true' &&
      (github.event_name != 'schedule' || vars.BOT_SCHEDULE_ENABLED == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONHASHSEED: '0'
      PAPER_KILL_SWITCH: ${{ vars.PAPER_KILL_SWITCH || 'true' }}
      CANARY_KILL_SWITCH: ${{ vars.CANARY_KILL_SWITCH || 'true' }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Install pinned open-source research libraries (no cache)
        run: python -m pip install --disable-pip-version-check -r requirements-research.txt
      - name: Safety and regression tests (no secrets)
        run: python -m unittest discover -s tests -v
      - name: Prepare durable state and verify Git write access
        id: state
        run: bash tools/state_branch.sh prepare
      - name: Run paper lab
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
          ALPACA_CANARY_API_KEY: ${{ secrets.ALPACA_CANARY_API_KEY }}
          ALPACA_CANARY_SECRET_KEY: ${{ secrets.ALPACA_CANARY_SECRET_KEY }}
          CANARY_SCHEDULE_ENABLED: ${{ vars.CANARY_SCHEDULE_ENABLED || 'false' }}
          REQUESTED_COMMAND: ${{ inputs.command || 'scheduled' }}
        shell: bash
        run: |
          set -euo pipefail
          SCHEDULED=false
          if [ "$REQUESTED_COMMAND" = scheduled ]; then
            SCHEDULED=true
            REQUESTED_COMMAND=$(python -c "import json; print('paper' if json.load(open('execution-policy.json'))['orders_enabled'] else 'shadow')")
            set +e
          fi
          run_canary() {
            ALPACA_API_KEY="$ALPACA_CANARY_API_KEY" ALPACA_SECRET_KEY="$ALPACA_CANARY_SECRET_KEY" "$@"
          }
          case "$REQUESTED_COMMAND" in
            preflight) python -m bot probe --state-dir runtime-state/runtime ;;
            research) python -m bot research --state-dir runtime-state/runtime ;;
            audit) python -m bot audit --state-dir runtime-state/runtime ;;
            validate)
              python -m bot probe --state-dir runtime-state/runtime
              python -m bot research --state-dir runtime-state/runtime
              python -m bot validate --state-dir runtime-state/runtime
              ;;
            shadow) python -m bot shadow --state-dir runtime-state/runtime ;;
            paper)
              if [ -f runtime-state/runtime/state.json ]; then
                python -m bot renew --state-dir runtime-state/runtime
              fi
              python -m bot paper --state-dir runtime-state/runtime
              ;;
            canary-preflight)
              run_canary python -m bot canary-probe --state-dir runtime-state/canary
              ;;
            canary-validate)
              python -m bot probe --state-dir runtime-state/runtime
              run_canary python -m bot canary-validate --state-dir runtime-state/canary --main-state-dir runtime-state/runtime
              ;;
            canary-paper)
              run_canary python -m bot canary-paper --state-dir runtime-state/canary
              ;;
            *) exit 2 ;;
          esac
          MAIN_STATUS=$?
          CANARY_STATUS=0
          if [ "$SCHEDULED" = true ] && [ "$CANARY_SCHEDULE_ENABLED" = true ]; then
            run_canary python -m bot canary-paper --state-dir runtime-state/canary
            CANARY_STATUS=$?
          fi
          if [ "$SCHEDULED" = true ]; then
            set -e
            if [ "$MAIN_STATUS" -ne 0 ] || [ "$CANARY_STATUS" -ne 0 ]; then
              exit 1
            fi
          fi
      - name: Persist decisions even after a failed command
        if: ${{ always() && steps.state.outcome == 'success' }}
        run: bash tools/state_branch.sh save
      - name: Publish concise run summary (no artifact storage)
        if: ${{ always() && steps.state.outcome == 'success' }}
        shell: bash
        run: |
          python tools/summary.py runtime-state/runtime >> "$GITHUB_STEP_SUMMARY"
          if [ -d runtime-state/canary ]; then
            python tools/summary.py runtime-state/canary >> "$GITHUB_STEP_SUMMARY"
          fi
